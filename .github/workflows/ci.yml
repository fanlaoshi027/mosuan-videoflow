name: Manual Desktop Build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Choose one platform per run'
        required: true
        type: choice
        default: windows
        options:
          - windows
          - macos
concurrency:
  group: videoflow-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: npm run tauri icon assets/icon.svg
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: videoflow-${{ inputs.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn
